<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma carta para você 💌</title>
<style>
body{margin:0;background:linear-gradient(#080611,#1a0f25);color:white;font-family:Georgia;text-align:center;overflow-x:hidden}
.stars{position:fixed;inset:0;background-image:radial-gradient(white 1px,transparent 1px);background-size:50px 50px;opacity:.2}
.container{position:relative;z-index:2;padding:30px}
.flower{font-size:90px;animation:bloom 3s infinite alternate}
@keyframes bloom{from{transform:scale(.8) rotate(-5deg)}to{transform:scale(1.1) rotate(5deg)}}
button{padding:15px 25px;border:none;border-radius:30px;background:#ff6ea8;color:white;font-size:18px}
video{width:90%;max-width:700px;border-radius:20px;margin-top:20px}
.card{max-width:800px;margin:20px auto;background:rgba(255,255,255,.08);padding:20px;border-radius:20px;
opacity:0;transform:translateY(20px);animation:show 1s forwards}
@keyframes show{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
<div class="flower">🌹</div>
<h1>Uma carta para você</h1>
<p>Toque abaixo para começar</p>
<button onclick="start()">Abrir 💌</button>

<div id="content" style="display:none">
<video controls autoplay>
<source src="video-nos.mp4" type="video/mp4">
</video>

<div class="card">
<h2>Minha carta</h2>
<p>Aqui fica o texto da sua carta "Carta para você nova".</p>
<p>O vídeo e a música já estão conectados ao site.</p>
</div>
</div>

<audio id="music" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>
</div>

<script>
function start(){
 document.getElementById('content').style.display='block';
 document.getElementById('music').play().catch(()=>{});
}
</script>
</body>
</html>
